<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="contenedor">
        <h1>Práctica JS - Actividades Varias</h1>
        <div class="ejercicios">
            <hr>
            <div class="ejercicio_1">
                <h2>Ejercicio 1: Validación de formulario</h2>
                <form >
                    <label for="text_nombre"> Ingrese su nombre: </label>
                    <input type="text" name="text_nombre" id="text_nombre">
                    <button onclick="validar_nombre()">validar ejercicio 1</button>
                </form>
                <hr>
                <div class="ejercicio_2">
                    <h2>Ejercicio 2 Mostrar y ocultar contenido</h2>
                    <p id="p_ejercicio_2">HOLA MUNDO</p>
                    <button onclick="ocultar_mostrar()">Pruebe</button>
                </div>
                <hr>
                <div class="ejercicio_3">
                    <h2>Ejercicio 3 cambiar el color de fondo</h2>
                    <form id="form_ejercicio_3">
                        <label for="input_color">Seleccione el color que desee</label>
                        <input type="color" name="input_color" id="input_color">
                        <button onclick="cambiar_color()">Validar</button>
                    </form>
                </div>
                <hr>
                <div class="ejercicio_4">
                    <h2>Ejercicio 4 Contador de clicks</h2>
                    <p id="p_conteo"></p>
                    <button onclick="funcion_contador()" id="boton_contador">Presione para aumentar</button>
                </div>
                <hr>
                <div class="ejercicio_5">
                    <h2>Ejercicio 5 mostrar la fecha y hora actual</h2>
                    <p id="p_fecha_hora"></p>
                </div>
                <hr>
                <div class="ejercicio_6">
                    <form>
                        <label for="nombre_usuario">Por favor ingrese nuevamente su nombre</label>
                        <input type="text" name="nombre_usuario" id="nombre_usuario">
                        <button onclick="mostrar_nombre()">Validar nuevamente</button>
                    </form>
                </div>
            </div>
        </div>
    </div>


    <script src="js/prueba_20.js"></script>
</body>
</html>
